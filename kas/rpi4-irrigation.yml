header:
  version: 14

machine: raspberrypi4-64
distro: poky
target: rpi4-irrigation-image

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: walnascar
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: walnascar
    layers:
      meta-oe:
      meta-networking:
      meta-python:
      meta-webserver:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: walnascar
    layers:
      .:

  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6.git
    branch: "6.10"
    layers:
      .:

  # Supplies tailscale, acme-sh, and the nginx bbappend (http2, stock site
  # removed) that irrigation.conf depends on.
  meta-rpi4-gateway:
    path: meta-rpi4-gateway
    layers:
      .:

  meta-rpi4-irrigation:
    path: meta-rpi4-irrigation
    layers:
      .:

local_conf_header:
  meta-rpi4-irrigation: |
    # Init system
    INIT_MANAGER = "systemd"

    # Headless controller — no display, no audio, no compositor. Also
    # drops network-facing services this appliance has no use for:
    # rpcbind (nfs), ofono (3g), neard (nfc) and bluetooth.
    DISTRO_FEATURES:remove = "x11 directfb vulkan wayland opengl nfs 3g nfc bluetooth"
    DISTRO_FEATURES:append = " pam"

    GPU_MEM = "16"
    ENABLE_UART = "1"

    hostname:pn-base-files = "irrigation"
    DEFAULT_TIMEZONE = "America/Los_Angeles"

    # Accept restricted licenses required for RPi WiFi/BT firmware
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

    # meta-qt6 enables the SQLite driver only through PACKAGECONFIG_KDE,
    # which is gated on the kde distro feature. A headless image never sets
    # it, so without this line qtbase builds with no SQL drivers and
    # QSqlDatabase::addDatabase("QSQLITE") fails at runtime on a clean build.
    PACKAGECONFIG:append:pn-qtbase = " sql-sqlite"

    # meta-oe carries libgpiod 1.6.5 and 2.2.2 side by side and their APIs
    # share no call signatures.
    PREFERRED_VERSION_libgpiod = "2.2.2"

    # The gpio= line drives the relay inputs high — the inactive level for a
    # LOW-trigger board — from firmware through kernel boot. It covers only
    # up to the point irrigationd requests the lines for itself: once a
    # process releases a GPIO line the kernel reverts it to input and the
    # pad's pull takes over, and six of the eight offsets (12, 13, 16, 19,
    # 20, 21) are in BCM 9-27, which pull down — asserted on this board.
    # gpio=25=ip,pu pulls the stop button's input high; it reads a ground
    # switch and needs the opposite bias from the eight outputs.
    RPI_EXTRA_CONFIG = 'dtparam=i2c_arm=on\ndtoverlay=i2c-rtc,ds3231\ngpio=5,6,12,13,16,19,20,21=op,dh\ngpio=25=ip,pu'

    # busybox-syslog carries both syslog.service and busybox-klogd.service, and
    # journald already holds everything they would write. Left at its default
    # the appliance duplicates the journal into /var/log/messages on the SD card.
    VIRTUAL-RUNTIME_base-utils-syslog = ""

    # Shared caches
    DL_DIR ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

    # Auto-clean work directories after each package builds
    INHERIT += "rm_work"

    # Parallelism — 48 cores
    BB_NUMBER_THREADS = "48"
    PARALLEL_MAKE = "-j 48"
