# Gateway dnsmasq main config
# Drop-in configs in /etc/dnsmasq.d/:
#   01-dns.conf          — upstream DNS servers, local domain
#   02-dhcp.conf         — DHCP range and options
#   03-static-leases.conf — static MAC-to-IP reservations (private overlay)
#   04-hosts.conf        — additional host entries (private overlay)

conf-dir=/etc/dnsmasq.d/,*.conf

# Do not read /etc/resolv.conf — we are the DNS server
no-resolv

# Only listen on local interfaces
bind-interfaces

# Only serve queries from the local network
local-service

# Cache size
cache-size=1000

# Log DHCP transactions
log-dhcp
