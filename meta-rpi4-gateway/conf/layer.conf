# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rpi4-gateway"
BBFILE_PATTERN_meta-rpi4-gateway = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rpi4-gateway = "10"

LAYERDEPENDS_meta-rpi4-gateway = "core networking-layer webserver"
LAYERSERIES_COMPAT_meta-rpi4-gateway = "walnascar"
