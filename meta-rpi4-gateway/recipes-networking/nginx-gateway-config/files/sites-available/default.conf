# Redirect all HTTP traffic to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS admin UI
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    ssl_certificate     /data/ssl/cert.pem;
    ssl_certificate_key /data/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/gateway/html;
    index index.html;
    server_name _;

    # Default 1MB is too small for app archives (cross-compiled binaries
    # + libs + assets) and full-config backup restores. 1G is plenty
    # while still bounding worst-case exposure.
    client_max_body_size 1G;

    # Admin API proxied to the backend.
    # The 60s default proxy_read_timeout is too tight for /api/backup —
    # tarring + gzipping /data on aarch64 takes ~75s once an app with a
    # bundled venv (kanoop = ~10k files) is installed. Proper fix is a
    # StreamingResponse on the backend; until then, wide timeout.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Named target for `error_page 401 = @to_login;` in per-app drop-ins.
    # External 302 (not internal rewrite) so the browser URL bar changes
    # and React Router on /login can read ?next=$request_uri.
    #
    # Only redirect actual document navigations; XHR/fetch consumers get a
    # raw 401. Otherwise the browser auto-follows the 302, downloads the
    # login HTML, and the calling app chokes trying to JSON.parse it.
    # `if` with a bare return is one of the safe nginx idioms.
    location @to_login {
        if ($http_sec_fetch_dest = "document") {
            return 302 /login?next=$request_uri;
        }
        return 401;
    }

    # Per-app reverse-proxy drop-ins, written by gateway-admin's installer.
    # Each location with gateway_auth="admin" uses `satisfy any` so tailnet
    # sources bypass auth_request, and non-tailnet sources are gated by the
    # admin session (with 401s redirected to @to_login above).
    include /etc/nginx/locations.d/apps/*.conf;

    # SPA: serve index.html for any route that doesn't match a file
    location / {
        try_files $uri $uri/ /index.html;
    }
}
