# Redirect all HTTP traffic to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS admin UI
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    ssl_certificate     /data/ssl/cert.pem;
    ssl_certificate_key /data/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/gateway/html;
    index index.html;
    server_name _;

    # Admin API proxied to the backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-app reverse-proxy drop-ins, written by gateway-admin's installer.
    # Each location uses auth_request /api/auth/check so the admin session
    # gates access to every app UI.
    include /etc/nginx/locations.d/apps/*.conf;

    # SPA: serve index.html for any route that doesn't match a file
    location / {
        try_files $uri $uri/ /index.html;
    }
}
