# Port 80 serves the app as-is: the LAN names (irrigation.local, the bare IP)
# have no publicly trusted certificate, and scripts POST to /api over plain HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/irrigation-app.conf;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /data/ssl/cert.pem;
    ssl_certificate_key /data/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/irrigation-app.conf;
}
