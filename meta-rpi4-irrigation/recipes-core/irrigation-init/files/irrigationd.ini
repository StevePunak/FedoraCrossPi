[gpio]
; zone=BCM offset. Zone numbers are what the API and the schedule address a
; valve by; the offsets are the wiring of this particular box.
; Quoted because QSettings reads an unquoted comma-bearing value as a
; QStringList, which toString() returns empty for; dropping the quotes
; gives the daemon zero zones.
zones="1=5,2=6,3=12,4=13,5=16,6=19,7=20,8=21"
chipLabel=pinctrl-bcm2711
; The relay board is LOW-trigger. The kernel performs the inversion once,
; on the line request; the daemon speaks logical values everywhere else.
zoneActiveLow=true
stopButtonOffset=25
; The gardener panel. Without runButtonOffset the RUN button is disabled;
; without either display key the panel runs without its display.
runButtonOffset=24
displayClockOffset=18
displayDataOffset=27

[limits]
maxZoneSeconds=3600

[server]
; Bound to loopback. nginx is the only thing that reaches it.
bindAddress=127.0.0.1
listenPort=8080

[database]
path=/data/irrigationd/irrigation.db
; The daemon refuses to start unless the database directory is on this
; mount. With /data missing it would otherwise create an empty database on
; the rootfs and run with no programs.
mountPoint=/data
